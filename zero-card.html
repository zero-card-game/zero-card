.rw{display:flex;gap:14px;align-items:center;padding:10px 0;border-top:1px solid var(--ln)}

.rw b{font-size:16px}.rl .rw p{margin:2px 0 0;color:#CBD1E6;font-size:14px;line-height:1.6}
.rl .t{color:#CBD1E6;line-height:1.7;margin:2px 0}
.chs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;text-align:center;padding:10px 0}
.chs div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:700}.chs .c{font-size:7px}.chs .c .lb,.chs .c .k1,.chs .c .k2{display:none}
.tip{background:rgba(245,184,0,.12);border:1px solid rgba(245,184,0,.4);border-radius:12px;padding:10px 12px;margin:10px 0;line-height:1.7;font-size:14px}
.rl .tip b{color:var(--ac)}

const chText=v=>{const u=CU[v]||(CU[v]=[]);let a=CT[v].map((x,i)=>i).filter(i=>!u.includes(i));if(!a.length){u.length=0;a=CT[v].map((x,i)=>i)}const i=rand(a);u.push(i);const x=CT[v][i];return typeof x=='function'?x():x};

const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};

function push(){MD={};MP={};$('#m').hidden=true;G.ver=(G.ver||0)+1;sel=[];mode='play';busy=false;opq=false;me=G.idx;render();checks()}

for(let c=0;c<4;c++){add(c,'n',0,2);for(let v=1;v<10;v++)add(c,'n',v,4);['skip','rev','p2'].forEach(k=>add(c,k,0,4));add(c,'m2',0,2);add(c,'sa',0,2)}
add(-1,'w',0,8);add(-1,'w4',0,8);add(-1,'m4',0,4);[2,3,4,6].forEach(v=>add(-1,'ch',v,2));add(-1,'th',0,6);add(-1,'cat',0,6);add(-1,'z',0,2);add(-1,'dn',0,4);add(-1,'dc',0,4);return shuffle(d)}

if(ON&&!CL&&G){if(d>=0&&cn(d)){MP[d]=o;MD[d]=H;return bcast()}

const tx=c=>c.k=='n'||c.k=='ch'?c.v:TX[c.k];
function cardHTML(c,i){const d=c.k=='ch'?CHP[c.v]:null,p=c.c>=0?PAL[c.c]:DK,t=tx(c),ic=t===undefined,

case'sa':log('تخطي الكل! العب تاني');return again();
case'cat':{const all=shuffle(P.flatMap(q=>q.h));P.forEach(q=>{q.h=all.splice(0,q.h.length)});log('🐱 القطة لخبطت ورق الكل');return again()}
case'th':return pickP('بدّل ورقك مع مين؟',t=>{[p.h,P[t].h]=[P[t].h,p.h];log(`🥷 ${p.n} بدّل مع ${P[t].n}`);endTurn()});
case'ch':return pickP('مين تتحداه؟ (ممكن نفسك)',t=>{const v=f.v,tx=chText(v);
handoff(t,()=>ask(`${P[t].n}: تحدي ${LV[v]}`,[['نفّذت ✅',()=>confirmExec(t,()=>pickP(`اختار مين ياخد ${v} كروت`,j=>{hit(j,t,q=>{dr(q,v);log(`${q.n} سحب ${v} (تحدي)`)});endTurn()},t,t),()=>{dr(P[t],v);log(`${P[t].n} ادّعى التنفيذ والباقي مأكدوش، سحب ${v}`);endTurn()})],['رفض ❌',()=>{dr(P[t],v);log(`${P[t].n} رفض وسحب ${v}`);endTurn()}]],tx,t))},-1);
case'z':{const m=Math.min(...P.map(q=>q.h.length));let W=P.filter(q=>q.h.length==m);const pm=Math.min(...W.map(q=>pts(q.h)));W=W.filter(q=>pts(q.h)==pm);return win(W,1)}
case'dn':return pickP('مين يسحب؟',t=>ask('لحد أنهي رقم؟',[...Array(10).keys()].map(v=>[v,()=>{hit(t,G.idx,q=>{const k=until(q,c=>c.k=='n'&&c.v==v);log(`${q.n} سحب ${k} لحد ما طلع ${v}`)});endTurn(1)}])));
case'dc':return pickP('مين يسحب؟',t=>pickCol(()=>{const c=G.col;hit(t,G.idx,q=>{const k=until(q,x=>x.c==c);log(`${q.n} سحب ${k} لحد ${CN[c]}`)});endTurn(1)}))}}
const pts=h=>h.reduce((s,c)=>s+(c.k=='n'?c.v:10),0);
function bot(){busy=true;const p=P[G.idx],N=P.length,nx=P[((G.idx+G.dir)%N+N)%N];
if(p.prot==0&&!G.pend&&p.h.length<=4&&Math.random()<.5){p.prot=1;p.r=3}
const mn=Math.min(...P.filter(q=>q!=p).map(q=>q.h.length));
const pk=()=>p.h.map((c,i)=>i).filter(i=>playable(p.h[i])&&(p.h[i].k!='z'||p.h.length-1<=mn));
if(G.pend&&!p.h.some(playable)){const n=G.pend.n;dr(p,n);log(`${p.n} سحب ${n} (تراكم)`);G.pend=null;return endTurn()}
let ok=pk();if(!ok.length){let k=0;while(!pk().length&&k<40&&dr(p,1))k++;log(`${p.n} سحب ${k} كروت`);ok=pk();if(!ok.length)return endTurn()}
const sc=i=>{const c=p.h[i],k=c.k;let s=Math.random();
if(k=='n')s+=c.v/2;else{s+=3;if(c.c<0&&p.h.length>3)s-=4;
if(['p2','w4','dn','dc','ch'].includes(k))s+=nx.h.length<=3?7:2;
if(k=='th')s+=p.h.length-mn>2?9:-6;if(k=='z')s+=40;if(k=='m2'||k=='m4')s+=5;if(k=='sa'||k=='skip')s+=2}return s};
const S=Object.fromEntries(ok.map(i=>[i,sc(i)])),i=ok.reduce((a,b)=>S[b]>S[a]?b:a);sel=[i];
const sm=p.h.map((c,j)=>j).filter(j=>j!=i&&key(p.h[j])==key(p.h[i])&&CB.includes(p.h[i].k));
if(!p.combo&&sm.length)sel=[i,sm[0]];
const cs0=sel.map(j=>p.h[j]);doPlay(p,cs0,cs0[0],cs0.length)}
function win(W,z){W=[].concat(W);const pool=P.filter(q=>!W.includes(q)).reduce((a,q)=>a+pts(q.h),0),sh=pool/W.length|0;W.forEach(q=>SC[q.id]=(SC[q.id]||0)+sh);G.sh=sh;G.win=(z?'الثانية صفر! ':'')+'فاز '+W.map(q=>q.n).join(' و ');push()}
function bcast(){if(!ON||CL||!G)return;P.forEach((q,i)=>{const c=cn(i);if(c&&c.open)c.send({t:'v',h:vh(i),m:MD[i]||null})})}
function lobbyBC(){const l=PL.map((x,i)=>(x.bot?'🤖 ':'')+(x.n||(i?'بوت':'المضيف')));PL.forEach(x=>{if(x.k&&x.k.open)x.k.send({t:'lobby',c:RC,l,tg:TG})})}
function lobby(){ON=1;$('#m').hidden=true;$('#g').innerHTML=`<div class=s>${logo()}<h2>🌐 غرفة أونلاين</h2><p class=mut>ابعت الكود ده لصحابك</p><div class=code>${RC}</div><div class=pnl>${PL.map((x,i)=>`<div class=prow>${i==0?`<input class=pn data-i=0 placeholder="اسمك" maxlength=12 value="${cl(x.n)}">`:`<span class="pl" style="flex:1">${x.bot?'🤖 بوت':'📱 '+cl(x.n)}</span>`}${i?`<button class=xr data-a=rm data-i=${i}>✕</button>`:''}</div>`).join('')}<p class=mut style="margin:8px 0 2px">${PL.length} لاعبين (من 2 لـ 8)</p><button data-a=addb ${PL.length>=8?'disabled':''}>+ بوت</button></div><div class=pnl><p class=mut style="margin:0 0 4px">الهدف:</p><button data-a=tg data-v=150 class=${TG==150?'g':'r'}>150 نقطة</button><button data-a=tg data-v=300 class=${TG==300?'g':'r'}>300 نقطة</button></div><button class=g data-a=start ${PL.length<2?'disabled':''} style="font-size:18px;padding:13px 30px">ابدأ اللعب</button><br><button class=r data-a=quit>خروج</button></div>`;lobbyBC()}
function onlineMenu(){$('#g').innerHTML=`<div class=s>${logo()}<h2>🌐 لعب أونلاين</h2><div class=pnl><button class=g data-a=host style="width:100%">افتح غرفة جديدة</button></div><div class=pnl><p class=mut style="margin:0">أو ادخل غرفة صاحبك</p><input id=jn placeholder="اسمك" maxlength=12><input id=jc placeholder="كود الغرفة" maxlength=4><button class=g data-a=join style="width:100%">ادخل</button></div><button class=r data-a=back>رجوع</button></div>`}
function leave(){try{PR&&PR.destroy()}catch(e){}PR=null;CL=null;ON=0;MD={};MP={};G=null;P=[];PL=[{n:'',bot:false},{n:'',bot:false}]}
function hostRoom(){if(typeof Peer=='undefined')return alert('محتاج إنترنت عشان الأونلاين');
RC=Math.random().toString(36).slice(2,6).toUpperCase();ON=1;PR=new Peer('zerocard-'+RC);
PR.on('open',()=>{PL=[{n:(PL[0]&&PL[0].n)||'',bot:false}];lobby()});
PR.on('connection',c=>{c.on('data',d=>hdata(c,d));c.on('close',()=>drop(c))});
PR.on('error',e=>{if(e.type=='unavailable-id')return hostRoom();alert('مشكلة في الاتصال');leave();home()})}
function hdata(c,d){if(d.t=='join'){if(G||PL.length>=8)return c.send({t:'err',m:'الغرفة مقفولة أو ممتلئة'});syncPL();PL.push({n:cl(String(d.n)).slice(0,12)||'لاعب',bot:false,k:c});return lobby()}
if(!G)return;const q=P.findIndex(z=>PL[z.id]&&PL[z.id].k===c);if(q<0)return;
if(d.a=='m'){const o=MP[q];if(!o||!o[d.i])return;MP[q]=null;MD[q]=null;bcast();return o[d.i][1]()}
if(!['c','play','draw','prot','shed','sur'].includes(d.a)||q!=G.idx)return;
d.a=='c'?go({dataset:{i:d.i}},null,1):go(null,{dataset:{a:d.a}},1)}
function drop(c){const i=PL.findIndex(x=>x.k===c);if(i<0)return;if(!G){PL.splice(i,1);return lobby()}
PL[i].bot=true;PL[i].s=1;const q=P.find(z=>z.id==i);if(!q||q.bot)return;const t=P.indexOf(q),o=MP[t];q.bot=true;q.n='🤖 '+q.n;MP[t]=null;MD[t]=null;log(`📴 ${q.n} فصل`);
if(o)return o[0][1]();if(t==G.idx&&!busy&&!G.win)push();else render()}
function joinRoom(code,n){if(typeof Peer=='undefined')return alert('محتاج إنترنت عشان الأونلاين');if(code.length<4)return alert('اكتب كود الغرفة');
ON=1;$('#g').innerHTML='<div class=s><p class=mut>جاري الاتصال...</p></div>';PR=new Peer();
const bad=m=>{alert(m);leave();home()};
PR.on('open',()=>{const c=PR.connect('zerocard-'+code,{reliable:true});c.on('open',()=>{CL=c;c.send({t:'join',n})});c.on('data',cdata);c.on('close',()=>{if(CL)bad('المضيف خرج من الغرفة')})});
PR.on('error',e=>bad(e.type=='peer-unavailable'?'الكود غلط أو الغرفة اتقفلت':'مشكلة في الاتصال'))}
function cdata(d){const m=$('#m');
if(d.t=='lobby'){m.hidden=true;$('#g').innerHTML=`<div class=s>${logo()}<h2>🌐 الغرفة ${d.c}</h2><div class=pnl>${d.l.map(x=>`<div class=prow><span class=pl style="flex:1">${cl(x)}</span></div>`).join('')}</div><p class=mut>الهدف: ${d.tg} نقطة</p><p class=mut>مستني المضيف يبدأ اللعب...</p><button class=r data-a=quit>خروج</button></div>`}
if(d.t=='v'){$('#g').innerHTML=d.h;const l=$('.log');if(l)l.scrollTop=l.scrollHeight;if(d.m){m.className='';m.innerHTML=d.m;m.hidden=false}else m.hidden=true}
if(d.t=='err'){alert(d.m);leave();home()}}
$('#m').onclick=e=>{const b=e.target.closest('button[data-i]');if(CL&&b)CL.send({a:'m',i:+b.dataset.i})};
home();
</script></body></html>
