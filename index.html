<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10131F"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<title>Zero Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{--bg:#10131F;--fg:#F3F4F8;--mut:#A9B0C8;--pn:#1B2036;--ln:rgba(255,255,255,.1);--ac:#F5B800;--gl:#262E57;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;background:var(--bg)}*{box-sizing:border-box}
body{margin:0;min-height:100%;background:radial-gradient(120% 60% at 50% 0%,var(--gl) 0%,transparent 100%);color:var(--fg);font-family:'Cairo',system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;font-weight:500}
#g{max-width:560px;margin:auto;padding:12px}
button{font:inherit;border:0;border-radius:12px;padding:12px 18px;min-height:46px;background:var(--bt);color:var(--btc);font-weight:800;margin:4px;cursor:pointer}
button:active{transform:translateY(1px)}
button:disabled{opacity:.4;cursor:default}
button.g{background:var(--ac);color:#231B00}
button.r{background:transparent;box-shadow:inset 0 0 0 2px #5A6390}
button:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:2px}
input{font:inherit;padding:12px;border-radius:12px;border:1px solid var(--ln);background:var(--in);color:var(--fg);text-align:center;width:100%;margin:4px 0}
input::placeholder{color:#7F88A8}
.s{text-align:center}
.mut{color:var(--mut)}
/* الشعار */
.lg{--z:84px;position:relative;width:var(--z);height:var(--z);margin:20px auto 26px;flex:none}
.lg .q{position:absolute;inset:0;transform:rotate(45deg);border-radius:26%;overflow:hidden;display:grid;grid-template-columns:1fr 1fr}
.lg .q i:nth-child(1){background:#D7263D}.lg .q i:nth-child(2){background:#F5B800}.lg .q i:nth-child(3){background:#1F5FD0}.lg .q i:nth-child(4){background:#17803F}
.lg b{position:absolute;inset:22%;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:calc(var(--z)*.4);font-weight:900;color:var(--fg);line-height:1}
.lg.sm{--z:26px;margin:3px 6px}
.nm{font-size:44px;font-weight:900;letter-spacing:.08em;direction:ltr;margin:0;line-height:1.1}.nm span{color:var(--ac)}
.tg{color:var(--mut);margin:8px 0 6px;font-size:17px}
.pnl{background:var(--pn);border:1px solid var(--ln);border-radius:18px;padding:14px;margin:12px 0}
.prow{display:flex;align-items:center;gap:6px}.prow input{flex:1;margin:4px 0}
.prow .pl{flex:1;justify-content:center;padding:12px;margin:4px 0}
button.xr{color:#fff;background:#D7263D;padding:0;width:46px;flex:none}
.top{display:flex;align-items:center;justify-content:space-between;margin:0 2px 10px}
.brand{display:flex;align-items:center;font-weight:900;letter-spacing:.08em;font-size:17px;direction:ltr}
.code{font-size:48px;letter-spacing:10px;padding:2px 10px 2px 20px;font-weight:900;direction:ltr;display:inline-block;background:#FFFDF8;color:#1C2030;border-radius:16px;margin:8px 0 14px}
/* اللعب */
.bar{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.pl{background:var(--pn);border:1px solid var(--ln);padding:5px 12px;border-radius:20px;font-size:14px;font-weight:700;margin:3px;display:inline-flex;gap:8px;align-items:center}
.pl em{font-style:normal;background:var(--in);border-radius:10px;padding:0 8px;min-width:26px;text-align:center}
.pl.on{background:var(--ac);color:#231B00;border-color:var(--ac)}.pl.on em{background:rgba(0,0,0,.16);color:#231B00}
.sh{font-size:11px;background:#1F5FD0;color:#fff;border-radius:8px;padding:0 6px}
.mid{display:flex;align-items:center;justify-content:center;gap:18px;margin:16px 0 12px}
.pile{text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}.pile small{color:var(--mut);font-size:12px}
.mid .c{font-size:14px}
.cur{padding:8px 16px;border-radius:12px;font-weight:800;border:2px solid #FFFDF8}
.log{background:var(--lgb);border:1px solid var(--ln);border-radius:12px;padding:8px 12px;font-size:13px;height:104px;overflow-y:auto;margin-bottom:8px;color:var(--lgc)}
.st{text-align:center;font-weight:900;margin:8px;font-size:18px}.st.me{color:var(--ac)}.warn{color:var(--wn);font-size:15px}
.hand{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:22px 0 10px;max-height:42vh;overflow-y:auto}
.act{text-align:center}.act small{color:var(--mut)}
/* الكروت */
.c{position:relative;width:7em;height:10.5em;font-size:12px;flex:none;border-radius:.75em;background:#FFFDF8;box-shadow:0 .5em 1em rgba(0,0,0,.4);cursor:pointer;transition:transform .15s;user-select:none}
.c[data-i="-1"],.c[data-i="-2"]{cursor:default}
.c .in{position:absolute;inset:.25em;border-radius:.55em;overflow:hidden;background:var(--bg);color:var(--ink)}
.c .in:before{content:"";position:absolute;inset:.3em;border-radius:.4em;border:1px solid var(--ln)}
.c .o2{position:absolute;left:50%;top:50%;width:5.8em;height:5.8em;margin:-2.9em 0 0 -2.9em;transform:rotate(45deg);border-radius:1.3em;border:1px solid var(--ln)}
.c .dm{position:absolute;left:50%;top:50%;width:3.6em;height:3.6em;margin:-1.8em 0 0 -1.8em;transform:rotate(45deg);border-radius:.85em;background:var(--pn)}
.c .sy{position:absolute;left:0;right:0;top:50%;height:3.4em;margin-top:-1.7em;display:flex;align-items:center;justify-content:center;color:var(--sc)}
.c .tx{font-size:2.4em;font-weight:900;line-height:1;direction:ltr;unicode-bidi:isolate;text-shadow:0 .08em 0 rgba(0,0,0,.16)}.c .tx.t2{font-size:1.8em}
.ic{width:2.3em;height:2.3em;fill:none;stroke:currentColor;stroke-width:3.6;stroke-linecap:round;stroke-linejoin:round}.ic.f{stroke:none}
.c .k1,.c .k2{position:absolute;font-size:.8em;font-weight:800;line-height:1;direction:ltr;display:flex;align-items:center}
.c .k1{top:.55em;left:.7em}.c .k2{bottom:.55em;right:.7em;transform:rotate(180deg)}
.c .k1 .ic,.c .k2 .ic{width:1.15em;height:1.15em;stroke-width:4.4}
.c .lb{position:absolute;left:0;right:0;bottom:1.9em;text-align:center;font-size:.8em;font-weight:800;line-height:1.2}
.c .bar{position:absolute;left:0;right:0;bottom:0;height:.3em;display:flex}
.c .bar i{flex:1}.c .bar i:nth-child(1){background:#D7263D}.c .bar i:nth-child(2){background:#F5B800}.c .bar i:nth-child(3){background:#17803F}.c .bar i:nth-child(4){background:#1F5FD0}
.c .qd{position:absolute;left:50%;top:50%;width:3.6em;height:3.6em;margin:-1.8em 0 0 -1.8em;transform:rotate(45deg);border-radius:.85em;overflow:hidden;display:grid;grid-template-columns:1fr 1fr}
.c .qd i:nth-child(1){background:#D7263D}.c .qd i:nth-child(2){background:#F5B800}.c .qd i:nth-child(3){background:#1F5FD0}.c .qd i:nth-child(4){background:#17803F}
.c.up{transform:translateY(-.9em);box-shadow:0 0 0 3px var(--ac),0 .5em 1em rgba(0,0,0,.4)}
.c.d{opacity:.45}
/* النوافذ: اللوحة فوق عشان تفضل شايف كروتك، والشاشة الكاملة للتسليم والقواعد */
#m{position:fixed;inset:0;display:flex;align-items:flex-start;justify-content:center;z-index:9;padding:max(8px,env(safe-area-inset-top)) 8px 8px;pointer-events:none}
#m.o{background:var(--bg);align-items:center;pointer-events:auto}
#m[hidden]{display:none}
.b{background:var(--pn);color:var(--fg);border-radius:20px;padding:12px 14px;text-align:center;max-width:380px;width:100%;max-height:45vh;overflow:auto;pointer-events:auto;box-shadow:0 6px 28px rgba(0,0,0,.7);border:1px solid rgba(255,255,255,.2)}
.b h3{margin:4px 0;font-size:19px}.b p{margin:4px 0;color:var(--mut)}.b p:empty{display:none}.b button{min-width:64px}
/* القواعد */
.b.rl{max-height:90vh;max-width:460px;text-align:right;padding:18px}
.rl h2{margin:0 0 4px;font-size:22px}.rl .sub{color:var(--mut);margin:0 0 6px}
.rl h4{margin:20px 0 2px;font-size:17px;color:var(--ac)}
.stp{display:flex;gap:10px;align-items:flex-start;margin:10px 0;line-height:1.6}
.stp .n{flex:none;width:28px;height:28px;border-radius:50%;background:var(--ac);color:#231B00;display:flex;align-items:center;justify-content:center;font-weight:900}
.rw{display:flex;gap:14px;align-items:center;padding:10px 0;border-top:1px solid var(--ln)}
.rw .c{font-size:6.5px}.rw .c .lb,.rw .c .k1,.rw .c .k2{display:none}
.rw b{font-size:16px}.rl .rw p{margin:2px 0 0;color:var(--mut);font-size:14px;line-height:1.6}
.rl .t{color:var(--mut);line-height:1.7;margin:2px 0}
.chs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;text-align:center;padding:10px 0}
.chs div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:700}.chs .c{font-size:7px}.chs .c .lb,.chs .c .k1,.chs .c .k2{display:none}
.tip{background:rgba(245,184,0,.12);border:1px solid rgba(245,184,0,.4);border-radius:12px;padding:10px 12px;margin:10px 0;line-height:1.7;font-size:14px}
.rl .tip b{color:var(--ac)}
.ic.w{width:3em;height:3em}
.dd{background:rgba(255,255,255,.05);border:1px solid var(--ln);border-radius:12px;padding:4px 10px;margin:12px 0 4px;text-align:right}
.dd summary{cursor:pointer;font-weight:800;padding:10px 2px;list-style:none}.dd summary::-webkit-details-marker{display:none}
.dd summary:after{content:"▾";float:left;color:var(--mut)}.dd[open] summary{color:var(--ac)}.dd[open] summary:after{content:"▴"}
.top button{padding:8px 9px;min-height:40px;margin:1px;font-size:14px}.top>span{white-space:nowrap}.top .th{font-size:20px;padding:8px 10px}.th,.ib{font-size:20px;line-height:1}
#fx{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:20;pointer-events:none}#fx.on{display:flex}
.fxb{display:flex;flex-direction:column;align-items:center;gap:.5em;color:#fff;text-shadow:0 .1em .4em rgba(0,0,0,.7);font-size:16px}
#fx.on .fxb{animation:fxp 1.3s cubic-bezier(.2,.9,.25,1) forwards}
.fxb b{font-size:2em;font-weight:900;text-align:center}.fxb small{font-size:1.1em;font-weight:700;opacity:.92}
.fxi{width:8.5em;height:8.5em;border-radius:50%;background:var(--fc);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 .3em rgba(255,255,255,.92),0 1em 3em rgba(0,0,0,.6)}
.fxi .ic{width:5.2em;height:5.2em;stroke-width:3.2}
@keyframes fxp{0%{transform:scale(.2) rotate(-12deg);opacity:0}18%{transform:scale(1.18) rotate(4deg);opacity:1}32%{transform:scale(1) rotate(0)}78%{opacity:1;transform:scale(1)}100%{transform:scale(1.12);opacity:0}}
.shk{animation:shk .45s linear}@keyframes shk{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@keyframes fxr{0%{opacity:0}15%,80%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){#fx.on .fxb{animation:fxr 1.3s forwards}.shk{animation:none}}
#cf{position:fixed;top:max(62px,calc(env(safe-area-inset-top) + 56px));left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:6px;z-index:11;pointer-events:none}
.cb{background:rgba(0,0,0,.8);border:1px solid var(--ln);border-radius:16px;padding:6px 14px;font-weight:800;font-size:15px;animation:cbi .25s ease-out}.cb.big{font-size:22px}
@keyframes cbi{from{transform:translateY(-8px);opacity:0}to{transform:none;opacity:1}}
#cp{position:fixed;inset:0;z-index:12;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.35)}#cp[hidden]{display:none}
.cpb{background:var(--pn);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:12px 12px max(12px,env(safe-area-inset-bottom));border:1px solid var(--ln);text-align:center}
.cpb button{margin:3px}.ce button{font-size:26px;padding:6px 12px;min-height:46px}.cm button{font-size:14px;padding:8px 12px;min-height:40px}
.av{font-size:34px;line-height:1}.avg button{font-size:28px;padding:6px 10px;min-width:52px;margin:3px}.avg button.g{outline:3px solid #fff}.tcd{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:12px 0}.tcd>div{cursor:pointer}.tfb{min-height:44px;font-weight:800}
#cn{position:fixed;top:0;left:0;right:0;z-index:30;background:#D7263D;color:#fff;text-align:center;font-weight:800;padding:calc(env(safe-area-inset-top,0px) + 6px) 8px 6px;font-size:14px}#cn[hidden]{display:none}

.trow{display:flex;align-items:center;gap:4px}.avb{font-size:24px!important;padding:2px 10px;border-radius:50%}
.tabs{display:flex;gap:4px;margin:10px 0;flex-wrap:wrap;justify-content:center}.tabs button{font-size:13px;padding:7px 10px;min-height:36px}
.xb{height:6px;border-radius:4px;background:var(--in);margin-top:6px;overflow:hidden}.xb i{display:block;height:100%;background:var(--ac);border-radius:4px}
.xpf{animation:xpg .9s ease-out}@keyframes xpg{from{width:0}}
.tt{font-size:10px;margin:0 3px;background:rgba(109,63,208,.25);border-radius:6px;padding:0 5px;font-weight:700}
.log .lg,#lgl .lg{padding:2px 6px;margin:1px 0;border-radius:4px}.lg.nw{animation:lgin .4s ease-out}@keyframes lgin{from{opacity:0;transform:translateX(14px);background:rgba(245,184,0,.3)}to{opacity:1;transform:none}}
@keyframes popc{0%{transform:translate(var(--ox,0),var(--oy,0)) scale(.85) rotate(-10deg);opacity:.3}70%{transform:scale(1.06) rotate(2deg);opacity:1}100%{transform:none;opacity:1}}.pop{animation:popc .42s cubic-bezier(.2,.8,.3,1)}
#m .b{animation:bin .22s ease-out}@keyframes bin{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
#cfx{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}#cfx i{position:absolute;top:-14px;width:9px;height:14px;border-radius:2px;animation:cfl linear forwards}@keyframes cfl{to{transform:translate(var(--x),105vh) rotate(var(--r));opacity:.9}}
button:active:not(:disabled){transform:scale(.95)}
@media(prefers-reduced-motion:reduce){.lg.nw,#m .b,.xpf,.pop{animation:none!important}#cfx{display:none}}
/* v10 */
#ver{position:fixed;left:8px;bottom:calc(env(safe-area-inset-bottom,0px) + 4px);font-size:11px;color:var(--mut);opacity:.55;pointer-events:none;z-index:5;direction:ltr;letter-spacing:.04em}
.fxb{position:relative}.fxr{position:absolute;left:50%;top:42%;width:8.5em;height:8.5em;margin:-4.25em 0 0 -4.25em;border-radius:50%;border:.3em solid var(--fc);opacity:0;pointer-events:none}
#fx.on .fxr{animation:fxring 1.1s ease-out .12s}@keyframes fxring{0%{transform:scale(.6);opacity:.95}100%{transform:scale(2.8);opacity:0}}
#fx.on[data-k=boom] .fxr,#fx.on[data-k=z] .fxr{animation:fxring2 1.3s ease-out .05s;border-width:.6em}@keyframes fxring2{0%{transform:scale(.3);opacity:1}100%{transform:scale(5);opacity:0}}
#fx.on[data-k=jkwin] .fxr{border-color:#F5B800}
#fx.on[data-k=boom]::before,#fx.on[data-k=z]::before{content:"";position:fixed;inset:0;background:#fff;opacity:0;animation:fxfl .6s ease-out}#fx.on[data-k=z]::before{background:#D7263D}@keyframes fxfl{0%{opacity:.8}100%{opacity:0}}
.fxq{position:absolute;left:50%;top:42%;font-style:normal;font-size:1.6em;opacity:0;pointer-events:none;animation:fxq var(--d,1s) ease-out forwards}
@keyframes fxq{0%{transform:translate(-50%,-50%) scale(.3);opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) rotate(var(--r,0deg)) scale(1);opacity:0}}
#fx.on[data-k=cat] .fxi{animation:kcat 1.2s ease-out}@keyframes kcat{0%{transform:translateX(-140%) rotate(-25deg)}30%{transform:translateX(0) rotate(8deg)}45%{transform:rotate(-8deg)}60%{transform:rotate(6deg)}100%{transform:none}}
#fx.on[data-k=th] .fxi{animation:kth 1.2s ease-in-out}@keyframes kth{0%{transform:translateX(160%) skewX(-20deg);opacity:0}25%{transform:none;opacity:1}70%{transform:none;opacity:1}100%{transform:translateX(-160%) skewX(20deg);opacity:0}}
#fx.on[data-k=z] .fxi,#fx.on[data-k=zero] .fxi{animation:kz 1.2s cubic-bezier(.2,.9,.3,1)}@keyframes kz{0%{transform:scale(3.2);opacity:0}22%{transform:scale(.88);opacity:1}32%{transform:scale(1.12)}42%,100%{transform:scale(1)}}
#fx.on[data-k=sn] .fxi{animation:ksn 1.1s ease-out}@keyframes ksn{0%{transform:scale(2.6);opacity:0}30%{transform:scale(1);opacity:1}55%{transform:scale(1)}62%{transform:translateY(-12px) scale(1.1)}100%{transform:none}}
#fx.on[data-k=tk] .fxi{animation:ktk 1.1s ease-in-out}@keyframes ktk{0%{transform:rotate(0) scale(.5)}60%{transform:rotate(540deg) scale(1.1)}100%{transform:rotate(720deg) scale(1)}}
#fx.on[data-k=tr] .fxi{animation:ktr 1s ease-out}@keyframes ktr{0%{transform:scale(1.8,.2);opacity:0}25%{transform:scale(.7,1.3);opacity:1}40%{transform:scale(1.15,.85)}55%,100%{transform:none}}
#fx.on[data-k=sa] .fxi{animation:ksa 1.1s ease-in-out}@keyframes ksa{0%{transform:translateX(-200%) skewX(25deg);opacity:0}30%{transform:none;opacity:1}70%{transform:none}100%{transform:translateX(200%) skewX(-25deg);opacity:0}}
#fx.on[data-k=jk] .fxi{animation:kjk 1.2s ease-in-out}@keyframes kjk{0%,100%{transform:none}15%{transform:rotate(-14deg) scale(1.1)}30%{transform:rotate(14deg)}45%{transform:rotate(-10deg)}60%{transform:rotate(10deg)}75%{transform:rotate(-5deg)}}
#fx.on[data-k=bm] .fxi{animation:kbm .15s linear 8}@keyframes kbm{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px) scale(1.04)}75%{transform:translateX(4px)}}
#fx.on[data-k=boom] .fxi{animation:kboom 1s ease-out}@keyframes kboom{0%{transform:scale(.1)}30%{transform:scale(1.6);filter:brightness(2)}100%{transform:scale(1);filter:none}}
.pl.on{animation:tpul 1.8s ease-in-out infinite}@keyframes tpul{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.pl em.bump{animation:bmp .45s ease-out}@keyframes bmp{0%{transform:scale(1)}40%{transform:scale(1.55)}100%{transform:scale(1)}}
.hand .c.drw{animation:drw .42s cubic-bezier(.2,.9,.3,1) backwards}@keyframes drw{from{transform:translateY(-70px) scale(.5) rotate(-12deg);opacity:0}}
.cur.wave{animation:cwv .7s ease-out}@keyframes cwv{0%{transform:scale(1.18);box-shadow:0 0 0 0 rgba(255,255,255,.85)}100%{transform:none;box-shadow:0 0 0 18px rgba(255,255,255,0)}}
.act button[data-a=zero]{animation:zpl 1s ease-in-out infinite}@keyframes zpl{0%,100%{box-shadow:0 0 0 0 rgba(215,38,61,.7)}50%{box-shadow:0 0 0 10px rgba(215,38,61,0)}}
.c:active{transform:scale(.96)}
#ws{position:fixed;inset:0;z-index:25;pointer-events:none;display:none;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;text-shadow:0 .1em .4em rgba(0,0,0,.7)}#ws.on{display:flex}
#ws .wsb{position:relative;display:flex;flex-direction:column;align-items:center;gap:.3em;font-size:16px;animation:wsb 2.6s ease-out forwards}@keyframes wsb{0%,80%{opacity:1}100%{opacity:0}}
#ws .wsi{font-size:7em;font-style:normal;line-height:1;display:block}#ws b{font-size:2.2em;font-weight:900}#ws small{font-size:1.3em}

<div class=tip><b>الكومبو:</b> مرة واحدة بس لكل لاعب في اللعبة كلها (مش كل جولة) تنزل أي عدد من الكروت اللي بنفس الرقم أو نفس الرمز مع بعض، وتأثيرهم بيتضاعف (الأرقام، سكيب، ريفيرس، +2، −2، سكيب أول، +4، −4، ريفيرس +2 و+4، تارجت +2 و+4). اختارهم كلهم الأول وبعدين اضغط العب.</div>
<div class=tip><b>الحماية:</b> بتفعّلها مرة واحدة بس في اللعبة كلها (مش كل جولة) في دورك وبتفضل 3 لفات. أول هجوم عليك (أي كارت سحب أو تراكم أو تحدي أو تارجت أو الفخ أو المحبة أو بلاك ليست أو خد وهات) بيتلغي تأثيره، ومبتسحبش حاجة وبتلعب دورك عادي. لو الهجوم جه على تراكم قايم، اللي لعب آخر كارت قبلك هو اللي بيسحب التراكم كله. ومينفعش تفعّل الحماية وقت التراكم. محدش من الباقيين بيشوف إنها شغالة.</div>
<h4>الشات والصوت</h4><div class=tip><b>الشات (أونلاين):</b> زرار 💬 فيه إيموجي ورسائل سريعة.<br><b>الأنيميشن والصوت والاهتزاز:</b> بيظهروا لما تتلعب الكروت اللي بتغيّر اللعبة (القطة، الحرامي، الجوكر، الثانية صفر، القناص، خد وهات، الفخ، سكيب أول، والحماية). زرار 🔊 بيكتم الصوت. الاهتزاز بيشتغل حسب الجهاز.</div>
