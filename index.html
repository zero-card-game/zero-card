<script>

function pickCol(cb){const b=P[G.idx],bk=b.bl?b.bl.c:-1;if(b.bot){const n=[0,1,2,3].map(c=>c==bk?-1:b.h.filter(x=>x.c==c).length);if(BLV==1)G.col=rand([0,1,2,3].filter(c=>c!=bk));else{if(BLV==3){const u=unseen(b),k=P[((G.idx+G.dir)%P.length+P.length)%P.length].h.length;n.forEach((x,c)=>{if(x>=0)n[c]=Math.max(-.5,x*1.5-u[c]*k)})}G.col=n.indexOf(Math.max(...n))}return cb()}ask('اختار اللون',COL.map((c,i)=>[CN[i],()=>{G.col=i;cb()},c,PAL[i].ink]).filter((x,i)=>i!=bk))}

if(G.pend&&!p.h.some(playable)){const n=G.pend.n;dr(p,n);log(`${p.n} سحب ${n} (تراكم)`);G.pend=null;return endTurn()}
let ok=pk();if(!ok.length){let k=0;while(!pk().length&&k<40&&dr(p,1))k++;log(`${p.n} سحب ${k} كروت`);ok=pk();if(!ok.length)return endTurn()}
const US=BLV==3?unseen(p):0,sc=i=>{const c=p.h[i],k=c.k;let s=BLV==1?Math.random()*20:BLV==3?0:Math.random();if(BLV==3&&c.c>=0)s+=2-US[c.c]*6;
if(k=='n')s+=c.v/2;else{s+=3;if(c.c<0&&p.h.length>3)s-=4;
if(['p2','w4','dn','dc','ch','p10','t2','t4','r2','r4','lv','bl'].includes(k))s+=nx.h.length<=3?7:2;
if(k=='th')s+=p.h.length-mn>2?9:-6;if(k=='z')s+=40;if(k=='tr')s+=8;if(k=='ba'||k=='sn'||k=='tk')s+=1;if(k=='m2'||k=='m4')s+=5;if(k=='sa'||k=='skip')s+=2}return s};
const S=Object.fromEntries(ok.map(i=>[i,sc(i)])),i=ok.reduce((a,b)=>S[b]>S[a]?b:a);sel=[i];
const sm=p.h.map((c,j)=>j).filter(j=>j!=i&&key(p.h[j])==key(p.h[i])&&CB.includes(p.h[i].k));
if(BLV>1&&!p.combo&&sm.length)sel=[i,sm[0]];
const cs0=sel.map(j=>p.h[j]);doPlay(p,cs0,cs0[0],cs0.length)}
function win(W,z){W=[].concat(W);if(TMV)W=P.filter(q=>W.some(w=>w.t==q.t));W.forEach(q=>sst(q,'rw'));const pool=P.filter(q=>!W.includes(q)).reduce((a,q)=>a+pts(q.h),0),sh=TMV?pool:pool/W.length|0;W.forEach(q=>SC[q.id]=(SC[q.id]||0)+sh);G.sh=sh;G.win=(z?'الثانية صفر! ':'')+'فاز '+W.map(q=>q.n).join(' و ');push()}
let BQ=0;function bcast(){if(!ON||CL||!G||BQ)return;BQ=1;setTimeout(()=>{BQ=0;if(!G)return;P.forEach((q,i)=>{const c=cn(i);if(c&&c.open)c.send({t:'v',h:vh(i),m:MD[i]||null})})},40)}
function lobbyBC(){const l=PL.map((x,i)=>(x.bot?'🤖 ':'')+(x.n||(i?'بوت':'المضيف')));PL.forEach(x=>{if(x.k&&x.k.open)x.k.send({t:'lobby',c:RC,l,tg:TG,ch:CH,op:[...OP]})})}
function lobby(){ON=1;$('#m').hidden=true;$('#g').innerHTML=`<div class=s><div style="text-align:left">${thBtn()}</div>${logo()}<h2>🌐 غرفة أونلاين</h2><p class=mut>ابعت الكود ده لصحابك</p><div class=code>${RC}</div><div class=pnl>${PL.map((x,i)=>`<div class=prow>${i==0?`<input class=pn data-i=0 placeholder="اسمك" maxlength=12 value="${cl(x.n)}">`:`<span class="pl" style="flex:1">${x.bot?'🤖 بوت':'📱 '+cl(x.n)}</span>`}${i?`<button class=xr data-a=rm data-i=${i}>✕</button>`:''}</div>`).join('')}<p class=mut style="margin:8px 0 2px">${PL.length} لاعبين (من 2 لـ 8)</p><button data-a=addb ${PL.length>=8?'disabled':''}>+ بوت</button></div><div class=pnl><p class=mut style="margin:0 0 4px">الهدف:</p><button data-a=tg data-v=150 class=${TG==150?'g':'r'}>150 نقطة</button><button data-a=tg data-v=300 class=${TG==300?'g':'r'}>300 نقطة</button><p class=mut style="margin:10px 0 4px">كروت التحدي:</p><button data-a=ch data-v=1 class=${CH?'g':'r'}>موجودة</button><button data-a=ch data-v=0 class=${CH?'r':'g'}>من غيرها</button>${optHTML()}${lvHTML()}</div><button class=g data-a=start ${PL.length<2?'disabled':''} style="font-size:18px;padding:13px 30px">ابدأ اللعب</button><br><button class=r data-a=quit>خروج</button></div>`;lobbyBC()}
function onlineMenu(){if(typeof Peer=='undefined')loadPeer(()=>{});$('#g').innerHTML=`<div class=s><div style="text-align:left">${thBtn()}</div>${logo()}<h2>🌐 لعب أونلاين</h2><div class=pnl><button class=g data-a=host style="width:100%">افتح غرفة جديدة</button></div><div class=pnl><p class=mut style="margin:0">أو ادخل غرفة صاحبك</p><input id=jn placeholder="اسمك" maxlength=12 value="${cl(NM)}"><input id=jc placeholder="كود الغرفة" maxlength=4><button class=g data-a=join style="width:100%">ادخل</button></div><button class=r data-a=back>رجوع</button></div>`}
function leave(){try{PR&&PR.destroy()}catch(e){}PR=null;CL=null;ON=0;MD={};MP={};G=null;P=[];PL=[{n:'',bot:false},{n:'',bot:false}]}
let LP=0;function loadPeer(cb){if(window.Peer)return cb();if(LP)return setTimeout(()=>loadPeer(cb),300);LP=1;const x=document.createElement('script');x.src='https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js';x.onload=()=>{LP=0;cb()};x.onerror=()=>{LP=0;alert('مش قادر أحمّل الأونلاين، اتأكد من النت')};document.head.appendChild(x)}
function hostRoom(){if(typeof Peer=='undefined')return loadPeer(hostRoom);
RC=Math.random().toString(36).slice(2,6).toUpperCase();ON=1;PR=new Peer('zerocard-'+RC);
PR.on('open',()=>{PL=[{n:(PL[0]&&PL[0].n)||'',bot:false}];lobby()});
PR.on('connection',c=>{c.on('data',d=>hdata(c,d));c.on('close',()=>drop(c))});
PR.on('error',e=>{if(e.type=='unavailable-id')return hostRoom();alert('مشكلة في الاتصال');leave();home()})}
function hdata(c,d){if(d.t=='join'){const nm=cl(String(d.n)).slice(0,12)||'لاعب';if(G){const i=PL.findIndex(x=>x.s&&x.n==nm);if(i<0)return c.send({t:'err',m:'الغرفة مقفولة أو ممتلئة'});const x=PL[i],q=P.find(z=>z.id==i);x.k=c;x.bot=false;delete x.s;if(q){q.bot=false;q.afk=0;q.n=nm;log(`🔌 ${nm} رجع للعبة`)}return render()}if(PL.length>=8)return c.send({t:'err',m:'الغرفة مقفولة أو ممتلئة'});syncPL();PL.push({n:nm,bot:false,k:c});return lobby()}
if(!G)return;const q=P.findIndex(z=>PL[z.id]&&PL[z.id].k===c);if(q<0)return;
if(d.a=='wake'){wake(P[q]);return}if(d.a=='chat'){const i=+d.i,now=Date.now();if(CHT[i]&&now-(c._ct||0)>1500){c._ct=now;chatRecv(P[q].n,i)}return}
if(d.a=='m'){const o=MP[q];if(!o||!o[d.i])return;MP[q]=null;MD[q]=null;bcast();return o[d.i][1]()}
if(!['c','play','draw','prot','shed','sur','zero'].includes(d.a)||q!=G.idx)return;
d.a=='c'?go({dataset:{i:d.i}},null,1):go(null,{dataset:{a:d.a}},1)}
function drop(c){const i=PL.findIndex(x=>x.k===c);if(i<0)return;if(!G){PL.splice(i,1);return lobby()}
PL[i].bot=true;PL[i].s=1;const q=P.find(z=>z.id==i);if(!q||q.bot)return;const t=P.indexOf(q),o=MP[t];q.bot=true;q.n='🤖 '+q.n;MP[t]=null;MD[t]=null;log(`📴 ${q.n} فصل`);
if(o)return o[0][1]();if(t==G.idx&&!busy&&!G.win)push();else render()}
function joinRoom(code,n){if(typeof Peer=='undefined')return loadPeer(()=>joinRoom(code,n));if(code.length<4)return alert('اكتب كود الغرفة');
ON=1;$('#g').innerHTML='<div class=s><p class=mut>جاري الاتصال...</p></div>';PR=new Peer();
const bad=m=>{alert(m);leave();home()};
PR.on('open',()=>{const c=PR.connect('zerocard-'+code,{reliable:true});c.on('open',()=>{CL=c;c.send({t:'join',n})});c.on('data',cdata);c.on('close',()=>{if(CL)bad('المضيف خرج من الغرفة')})});
PR.on('error',e=>bad(e.type=='peer-unavailable'?'الكود غلط أو الغرفة اتقفلت':'مشكلة في الاتصال'))}
function cdata(d){const m=$('#m');if(d.t=='st')return stat(d.k);if(d.t=='v'&&d.h.includes('st me')&&Date.now()-(cdata.p||0)>8000){cdata.p=Date.now();turnPing()}if(d.t=='chat')return chatShow(d.n,d.i);if(d.t=='fx')return fxShow(d.k,d.n);
if(d.t=='lobby'){m.hidden=true;$('#g').innerHTML=`<div class=s><div style="text-align:left">${thBtn()}</div>${logo()}<h2>🌐 الغرفة ${d.c}</h2><div class=pnl>${d.l.map(x=>`<div class=prow><span class=pl style="flex:1">${cl(x)}</span></div>`).join('')}</div><p class=mut>الهدف: ${d.tg} نقطة · كروت التحدي: ${d.ch?'موجودة':'من غيرها'}</p><p class=mut>الكروت الاختيارية: ${d.op&&d.op.length?d.op.map(k=>(OPT.find(o=>o[0]==k)||[0,k])[1].replace(' (نسخة واحدة)','')).join('، '):'مفيش'}</p><p class=mut>مستني المضيف يبدأ اللعب...</p><button class=r data-a=quit>خروج</button></div>`}
if(d.t=='v'){$('#g').innerHTML=d.h;syncUI();const l=$('.log');if(l)l.scrollTop=l.scrollHeight;if(d.m){m.className='';m.innerHTML=d.m;m.hidden=false}else m.hidden=true}
if(d.t=='err'){alert(d.m);leave();home()}}
$('#m').onclick=e=>{const b=e.target.closest('button[data-i]');if(CL&&b)CL.send({a:'m',i:+b.dataset.i})};
if(NM)PL[0].n=NM;
theme(0);home();
</script></body></html>
